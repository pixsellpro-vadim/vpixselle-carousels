<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"InterX";src:url("Inter-ExtraBold.otf");font-weight:800}
@font-face{font-family:"InterX";src:url("Inter-SemiBold.otf");font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#EDEBE5}
body{font-family:"InterX",sans-serif;font-weight:600;color:#1F1E1D;position:relative}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(1150px 1600px at 50% 44%,#F4F2ED 0%,#ECE9E3 52%,#D8D1C8 100%)}
#dots{position:absolute;left:-60px;top:-60px;width:1200px;height:2040px;background-image:radial-gradient(rgba(125,108,92,.17) 2.2px,transparent 2.8px);background-size:46px 46px}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;transform-origin:50% 42%}
.cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 40%}
.a{position:absolute}
.card{position:absolute;background:#fff;border-radius:36px;box-shadow:0 28px 64px rgba(80,52,30,.13),0 4px 14px rgba(80,52,30,.06)}
.mono{font-family:"DejaVu Sans Mono",monospace;font-weight:400}
#cap{position:absolute;left:50px;width:980px;top:205px;height:140px;text-align:center;font-size:52px;font-weight:600;line-height:1.22}
#cap .ch{position:absolute;left:0;top:0;width:980px;display:none}
#cap span{display:inline-block;margin:0 .1em;padding:0 .14em;border-radius:10px;color:#BBB6AE}
#cap span.on{color:#1F1E1D}
#cap span.k.on{box-shadow:0 0 0 3px rgba(88,112,160,.55)}
#chars{position:absolute;left:0;top:0;width:1080px;height:1920px}
#chars img{position:absolute;display:none;transform-origin:50% 100%;filter:drop-shadow(0 34px 40px rgba(70,45,25,.28))}
#fx{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#fx div{position:absolute;left:0;top:0;display:none}
#flash{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(900px 1400px at 50% 50%,rgba(220,60,40,0) 40%,rgba(220,50,35,.55) 100%);opacity:0;pointer-events:none}
.say{position:absolute;display:none;background:#fff;border-radius:34px;padding:18px 30px;font-size:40px;font-weight:800;color:#1F1E1D;box-shadow:0 16px 36px rgba(70,45,25,.22);white-space:nowrap;transform-origin:20% 100%}
.say:after{content:'';position:absolute;left:40px;bottom:-16px;border:16px solid transparent;border-top-color:#fff;border-bottom:0}
</style></head>
<body>

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

function S(e,p){let s=e._b+';';for(const k in p)s+=k+':'+p[k]+';';if(s!==e._last){e.style.cssText=s;e._last=s}}
// універсальна анімація: поява (t), відхід углиб (back), зникнення (gone), рухи (mv)
function A(e,lt,o){
 const s0=o.s0??.86,pi=P(lt,o.t??0,o.d??.45),eb=o.lin?EO(pi):EB(pi),eo=EO(pi);
 let op=clamp(pi*2.4),sc=s0+(1-s0)*eb,dx=(o.dx||0)*(1-eo),dy=(o.dy??34)*(1-eo),bl=0,rot=(o.rot||0)*(1-eo)+(o.r||0);
 if(o.mv)for(const m of o.mv){const pm=EIO(P(lt,m.t,m.d||.5));dx+=(m.dx||0)*pm;dy+=(m.dy||0)*pm;sc*=1+((m.s??1)-1)*pm}
 if(o.back!=null){const pb=EIO(P(lt,o.back,o.bd??.5));sc*=1-(1-(o.bs??.93))*pb;op*=1-(1-(o.bop??.3))*pb;bl+=(o.bbl??9)*pb}
 if(o.gone!=null){const pg=EIO(P(lt,o.gone,o.gd??.35));op*=1-pg;sc*=1-.1*pg;bl+=8*pg}
 S(e,{opacity:op.toFixed(3),transform:`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(${sc.toFixed(4)}) rotate(${rot.toFixed(2)}deg) ${o.tf||''}`,filter:bl>.2?`blur(${bl.toFixed(1)}px)`:'none'});
 return pi}

 mk('a',null,t,`left:0;top:${Math.round(s*.56)-2}px;width:${s}px;height:4px;background:rgba(0,0,0,.16)`);
 return{t,n,set(lt,a,b,tf){const p=P(lt,tf,.38);let v=p<.5?a:b,k=p<.5?1-2*p:2*p-1;if(p<=0){v=a;k=1}if(p>=1){v=b;k=1}n.innerHTML=String(v);S(n,{transform:`scaleY(${Math.max(.02,k).toFixed(3)})`})}}}

 cfg.lines.forEach((L,i)=>{const t0=i?TL[i].t0:0,t1=i<n-1?TL[i+1].t0:cfg.total+1;const D=t1-t0;
  const root=mk('sc',null,stage,'');const cam=mk('cam',null,root,'');
  const d=L.sc||{type:'hook'};const f=SC[d.type]||SC.button;const m=f(D,cam,d);
  if(m.burstAt)burst(t0+m.burstAt[0],m.burstAt[1],m.burstAt[2],34);
  (m.ev||[]).forEach(e=>{if(e.t<D)EVENTS.push({t:+(t0+e.t).toFixed(3),k:e.k})});if(i)EVENTS.push({t:+t0.toFixed(3),k:'whoosh'});
  SCN.push({root,cam,m,t0,t1,D});
  // субтитри
  const lt0=TL[i].t0,ld=TL[i].d-.15;const ch=chunks(L.text);const all=ch.flat();const wl=all.map(x=>x.replace(/\*/g,'').length+2);const tot=wl.reduce((a,b)=>a+b,0);
  let acc=0;const wt=wl.map(v=>{const s=lt0+ld*acc/tot;acc+=v;return s});let wi=0;
  ch.forEach((c,ci)=>{const e=mk('ch',null,cap,'');const sp=c.map(x=>{const key=/\*/.test(x);const s=document.createElement('span');s.textContent=x.replace(/\*/g,'');if(key)s.className='k';e.appendChild(s);return{s,t:wt[wi++]}});
   CAPS.push({e,sp,t0:sp[0].t,t1:0});sp.forEach(w=>{if(w.s.className==='k'){PUNCH.push({t:w.t,sh:!!(L.fx&&L.fx.shake)});EVENTS.push({t:+w.t.toFixed(3),k:(L.fx&&L.fx.shake)?'thud':'pop'})}})});
  // персонаж
  if(L.char){const im=document.createElement('img');im.src=(L.char.img||'ch_s1_point')+'.webp';const h=L.char.h||980;im.style.height=h+'px';chars.appendChild(im);
   let say=null;if(L.char.say){say=mk('say',esc(L.char.say),chars,'');EVENTS.push({t:+(t0+(L.char.in??.15)+.6).toFixed(3),k:'pop'})}
   CHAR.push({im,t0:t0+(L.char.in??.15),t1:t1+.1,top:L.char.top??760,h,x:L.char.x,say})}});
 for(let i=0;i<CAPS.length;i++)CAPS[i].t1=i<CAPS.length-1?CAPS[i+1].t0:cfg.total;
 // підпис наприкінці: тримаємо останній шматок до кінця
 EVENTS.sort((a,b)=>a.t-b.t);window.READY=Promise.all([...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r})));return window.READY}
function seek(t){
 S(document.getElementById('dots'),{transform:`translate(${(-(t*6)%46).toFixed(1)}px,${(-(t*9)%46).toFixed(1)}px)`});
 SCN.forEach((s,i)=>{const vis=t>=s.t0-.02&&t<s.t1+.5;if(!vis){if(s.root._v){s.root.style.display='none';s.root._v=0}return}
  if(!s.root._v){s.root._v=1}const lt=t-s.t0;
  const pe=P(t,s.t1-.05,.45),pi=i?EO(P(lt,0,.35)):1;
  S(s.root,{display:'block',opacity:(pi*(1-pe)).toFixed(3),transform:`scale(${((1.04-.04*pi)*(1-.1*EIO(pe))).toFixed(4)})`,filter:pe>0?`blur(${(16*pe).toFixed(1)}px)`:'none'});
  S(s.cam,{transform:`scale(${(1+.025*clamp(lt/Math.max(1,s.D))).toFixed(4)})`});
  s.m.upd(lt)});
 CAPS.forEach(c=>{const on=t>=c.t0-.02&&t<c.t1;if(!on){if(c._v){c.e.style.display='none';c._v=0}return}c._v=1;
  const p=EO(P(t,c.t0-.02,.18));c.e.style.display='block';c.e.style.opacity=String(p);c.e.style.transform=`translateY(${(10*(1-p)).toFixed(1)}px)`;
  c.sp.forEach(w=>{const o=t>=w.t;if(o!==w._o){w.s.classList.toggle('on',o);w._o=o}})});
 CHAR.forEach(c=>{const on=t>=c.t0&&t<c.t1+.4;if(!on){c.im.style.display='none';return}
  const pi=P(t,c.t0,.55),po=EIO(P(t,c.t1-.05,.4)),w=c.im.naturalWidth*c.h/c.im.naturalHeight;const x=c.x??(1080-150-w);
  const dx=(1-EB(pi))*420+po*480,br=1+.012*Math.sin(t*2.6),sw=1.1*Math.sin(t*1.7);
  c.im.style.display='block';c.im.style.left=x+'px';c.im.style.top=c.top+'px';c.im.style.opacity=String(clamp(pi*3)*(1-po));
  c.im.style.transform=`translateX(${dx.toFixed(1)}px) rotate(${sw.toFixed(2)}deg) scale(${br.toFixed(4)},${(2-br).toFixed(4)})`;
  if(c.say){const ps=P(t,c.t0+.6,.35);const e=EB(ps);c.say.style.display=ps>0?'block':'none';c.say.style.left=(x+w*.18)+'px';c.say.style.top=(c.top-110)+'px';c.say.style.opacity=String(clamp(ps*3)*(1-po));c.say.style.transform=`translate(${dx.toFixed(1)}px,${(Math.sin(t*3)*6).toFixed(1)}px) scale(${(.3+.7*e).toFixed(3)}) rotate(-4deg)`}});
 let pz=0,sx=0,sy=0,fl=0;PUNCH.forEach(p=>{const u=t-p.t;if(u<-.05||u>.6)return;const e=u<.07?clamp((u+.05)/.12):Math.exp(-(u-.07)*7);pz+=(p.sh?.075:.045)*e;if(p.sh){sx+=Math.sin(u*90)*22*e;sy+=Math.cos(u*77)*14*e;fl=Math.max(fl,e)}});
 S(document.getElementById('stage'),{transform:`translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${(1+pz).toFixed(4)})`,'transform-origin':'50% 45%'});
 S(document.getElementById('chars'),{transform:`translate(${(sx*.6).toFixed(1)}px,${(sy*.6).toFixed(1)}px)`});
 S(document.getElementById('flash'),{opacity:(fl*.8).toFixed(3)});
 drawBursts(t);
 return true}
</script>
</body></html>

name: prom-parser
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      max_companies:
        description: "Нових компаній за запуск"
        default: "100"
      dry_run:
        description: "1 = лише лог, без запису в таблицю"
        default: "0"
permissions:
  contents: read
concurrency:
  group: prom-parser
  cancel-in-progress: false
jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse Prom contacts
        timeout-minutes: 340
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          MAX_COMPANIES: ${{ github.event.inputs.max_companies || '100' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          # довгий запуск: партії по MAX_COMPANIES підряд до ~5 год; cron лише підстраховує, якщо запуск обірвався
          end=$((SECONDS + 18000))
          fails=0
          while [ "$SECONDS" -lt "$end" ]; do
            rc=0
            python -u prom_parser/parse.py || rc=$?
            if [ "$rc" -eq 0 ]; then fails=0; continue; fi
            echo "parse.py exit code $rc (3 = nothing to do, 4 = blocked/stub page, other = error)"
            if [ "$rc" -eq 3 ] || [ "$rc" -eq 4 ]; then break; fi
            fails=$((fails + 1))
            if [ "$fails" -ge 5 ]; then echo "5 errors in a row - giving up"; exit "$rc"; fi
            sleep 120
          done

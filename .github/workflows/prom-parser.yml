name: prom-parser
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      max_companies:
        description: "Нових компаній за запуск"
        default: "100"
      dry_run:
        description: "1 = лише лог, без запису в таблицю"
        default: "0"
permissions:
  contents: read
concurrency:
  group: prom-parser
  cancel-in-progress: false
jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse Prom contacts
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          MAX_COMPANIES: ${{ github.event.inputs.max_companies || '100' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python prom_parser/parse.py

<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>explainer scenes v3</title>
<style>
@font-face{font-family:"InterX";src:url("Inter-SemiBold.otf");font-weight:600;}
@font-face{font-family:"InterX";src:url("Inter-ExtraBold.otf");font-weight:800;}
:root{
  --blue:#0A4B8F; --blue2:#1D6FD8; --orange:#DE4B20; --muted:#8F8A7C; --ink:#14233F;
  --green:#1FA97A; --red:#D8454F; --gray:#F4F0E8; --line:#E9E1D3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"InterX","Inter",sans-serif;font-weight:600;color:var(--ink);position:relative;background:#F4F1EC}
.abs{position:absolute}
#bg{left:0;top:0;width:1080px;height:1920px;
  background:radial-gradient(900px 760px at 20% 12%,#FFFFFF 0%,rgba(255,255,255,0) 70%),
             radial-gradient(900px 800px at 90% 75%,#EDE7DE 0%,rgba(237,231,222,0) 70%),#F4F1EC}
#fog1,#fog2{width:700px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0))}
/* підписи */
#capWrap{left:50px;top:240px;width:980px;height:200px;display:flex;align-items:center;justify-content:center;text-align:center}
.chunk{display:none;font-size:62px;font-weight:600;line-height:1.14;letter-spacing:-.3px;white-space:nowrap}
.chunk .w{display:inline-block;margin:0 .13em}
.chunk .kw{position:relative;display:inline-block;margin:0 .1em}
.chunk .kw .w{margin:0 .1em}
.chunk .w.adj{margin-left:0}
.chunk .bx{position:absolute;left:-.1em;right:-.1em;top:.04em;bottom:-.04em;border:3px solid var(--blue2);border-radius:.12em;pointer-events:none;background:rgba(29,111,216,.06)}
.chunk .bx b{position:absolute;width:.17em;height:.17em;background:#fff;border:3px solid var(--blue2);border-radius:.04em}
.chunk .bx b:nth-child(1){left:-.1em;top:-.1em}.chunk .bx b:nth-child(2){right:-.1em;top:-.1em}
.chunk .bx b:nth-child(3){left:-.1em;bottom:-.1em}.chunk .bx b:nth-child(4){right:-.1em;bottom:-.1em}
/* beats */
.beat{left:0;top:0;width:1080px;height:1920px;display:none;will-change:transform,opacity}
#stage{left:60px;top:470px;width:960px;height:690px;background:#fff;border-radius:44px;
  box-shadow:0 30px 70px rgba(80,55,20,.16),0 2px 8px rgba(80,55,20,.06);overflow:hidden;transform-origin:50% 100%}
/* slam */
.ring{position:absolute;border-radius:50%;border:3px solid rgba(160,130,100,.35);background:radial-gradient(closest-side,rgba(255,255,255,.7),rgba(255,255,255,0))}
.slamtxt{position:absolute;left:70px;width:940px;font-weight:800;line-height:.98;text-transform:uppercase;letter-spacing:-1.5px;color:var(--ink)}
.slamtxt div{display:block;transform-origin:0 60%}
.slamtxt .o{color:var(--orange)}
.covtxt{position:absolute;left:70px;width:940px;font-weight:800;line-height:1.03;letter-spacing:-1.5px;color:var(--ink)}
.covtxt .o{color:var(--orange)}
.covbar{position:absolute;left:70px;height:16px;width:250px;border-radius:8px;background:var(--orange)}
.spark{position:absolute;width:46px;height:46px}
/* punch */
.plate{position:absolute;left:50%;top:760px;border-radius:44px;background:var(--orange);color:#fff;font-weight:800;text-align:center;line-height:1.02;
  box-shadow:0 0 0 14px rgba(222,75,32,.14),0 30px 60px rgba(222,75,32,.35);display:flex;align-items:center;justify-content:center;letter-spacing:-1px}
.pcard{position:absolute;left:50%;top:730px;background:#fff;border-radius:48px;color:var(--ink);font-weight:800;text-align:center;line-height:1.02;letter-spacing:-1px;
  box-shadow:0 30px 70px rgba(80,55,20,.18);display:flex;align-items:center;justify-content:center}
.ripple{position:absolute;border-radius:50%;border:5px solid rgba(255,255,255,.9)}
/* cta */
.ctacard{position:absolute;left:90px;top:520px;width:900px;background:#fff;border-radius:48px;padding:56px 50px 50px;text-align:center;
  box-shadow:0 30px 70px rgba(80,55,20,.18)}
.ctacard .ti{font-size:58px;font-weight:800;line-height:1.1;letter-spacing:-.6px}
.ctacard .ti em{font-style:normal;color:var(--orange)}
.ctacard .su{font-size:32px;color:var(--muted);margin-top:16px}
.ctabtn{margin:40px auto 0;width:780px;height:120px;border-radius:32px;background:var(--orange);color:#fff;font-size:48px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 14px 30px rgba(222,75,32,.35)}
.ctabtn svg{width:50px;height:50px}
#cursor{width:84px;height:84px;display:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));z-index:50}
/* герой */
#char{width:700px;height:760px;transform-origin:50% 100%;z-index:20}
#char img{position:absolute;left:50%;bottom:0;height:760px;transform:translateX(-50%);display:block}
#shadow{width:340px;height:44px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,35,63,.28),rgba(20,35,63,0));z-index:19}
/* stage internals */
.bar{position:absolute;left:0;top:0;width:100%;height:96px;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:18px;background:#FCFAF6}
.bar .t{font-size:42px;font-weight:800;color:var(--ink)}
.bar .s{font-size:30px;color:var(--muted)}
.bar .right{margin-left:auto;font-size:32px;font-weight:800;color:var(--blue)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--green);display:inline-block}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
svg.ic{width:100%;height:100%}
.msg{position:absolute;max-width:740px;padding:18px 26px;border-radius:34px;font-size:38px;line-height:1.2;font-weight:600}
.msg.c{background:var(--blue);color:#fff;border-bottom-right-radius:10px}
.msg.b{background:var(--gray);color:var(--ink);border-bottom-left-radius:10px}
.msg .meta{display:block;margin-top:10px;font-size:28px;color:var(--green);font-weight:800}
.msg b{font-weight:800}
.sys{position:absolute;padding:16px 28px;border-radius:40px;border:3px solid var(--orange);color:var(--orange);font-size:34px;font-weight:800;background:#FFF6F2;white-space:nowrap}
.typing{position:absolute;background:var(--gray);border-radius:36px;border-bottom-left-radius:10px;padding:26px 34px;display:flex;gap:12px}
.typing i{width:16px;height:16px;border-radius:50%;background:#B3AA98;display:block}
.row{position:absolute;left:34px;width:892px;height:104px;border-radius:26px;background:var(--gray);display:flex;align-items:center;padding:0 28px;border-left:14px solid var(--blue2)}
.row>div{max-width:540px}
.row .l{font-size:42px;font-weight:800;line-height:1.1}
.row .n{font-size:30px;color:var(--muted);margin-top:4px;font-weight:600}
.row .n u{text-decoration:none;color:var(--orange);font-weight:800}
.row.bad{border-left-color:var(--red);background:#FDEEEC}
.row.good{border-left-color:var(--green);background:#EAF8F2}
.token{position:absolute;right:46px;width:auto;height:84px;border-radius:42px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:14px;padding:0 24px;font-size:30px;font-weight:800;box-shadow:0 10px 24px rgba(10,75,143,.35);white-space:nowrap}
.node{position:absolute;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.node.on{background:var(--blue2)}
.node.off{background:#EAE4D8}
.node.hub{background:var(--orange)}
.nlabel{position:absolute;font-size:40px;font-weight:800;line-height:1.1;text-align:center;color:var(--ink)}
.nsub{display:block;font-size:28px;font-weight:600;color:var(--muted);margin-top:4px}
.badge{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--green);border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.kpi-l{position:absolute;left:44px;font-size:36px;color:var(--muted);font-weight:600}
.kpi-n{position:absolute;left:40px;font-size:150px;font-weight:800;color:var(--blue);line-height:1}
.brow{position:absolute;left:44px;width:872px}
.brow .bl{font-size:40px;font-weight:800;margin-bottom:8px}
.track{position:relative;height:60px;border-radius:30px;background:var(--gray)}
.fill{position:absolute;left:0;top:0;height:60px;border-radius:30px;background:var(--blue2)}
.bv{position:absolute;right:20px;top:0;height:60px;display:flex;align-items:center;font-size:36px;font-weight:800;color:var(--blue)}
.chip{position:absolute;padding:14px 26px;border-radius:32px;font-size:34px;font-weight:800;background:var(--gray);color:var(--muted);white-space:nowrap}
.card{position:absolute;left:44px;width:872px;border-radius:30px;padding:26px 32px}
.card .k{font-size:30px;font-weight:800;letter-spacing:.5px;margin-bottom:10px}
.card .v{font-size:44px;font-weight:800;line-height:1.14}
.item{position:absolute;left:44px;width:872px;height:112px;border-radius:26px;background:var(--gray);display:flex;align-items:center;padding:0 26px;gap:22px}
.item .m{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;flex:none}
.item .m svg{width:36px;height:36px}
.item .x{font-size:44px;font-weight:800;line-height:1.1}
.item .y{font-size:30px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="fog1" class="abs"></div>
<div id="fog2" class="abs"></div>
<div id="beats" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
<div id="shadow" class="abs"></div>
<div id="char" class="abs"></div>
<div id="capWrap" class="abs"></div>
<svg id="cursor" class="abs" viewBox="0 0 24 26"><path d="M3 2 L3 20 L8 15.5 L11.5 23 L14.5 21.5 L11 14 L18 14 Z" fill="#111" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>

<script>
"use strict";
/* ================= утиліти ================= */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,t0,d)=>clamp((t-t0)/d);
const EO=p=>1-Math.pow(1-p,3);
const EIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const EB=p=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
let DIRTY=false;
function ss(el,k,v){const c=el.__s||(el.__s={});if(c[k]!==v){c[k]=v;el.style[k]=v;DIRTY=true;}}
function sh(el,html){if(el.__h!==html){el.__h=html;el.innerHTML=html;DIRTY=true;}}
const f1=x=>x.toFixed(1), f2=x=>x.toFixed(2);
function $(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
function accent(s){return s.replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function plain(s){return s.replace(/\*/g,'');}
const fmtN=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* ---------- іконки (прості контури, власні) ---------- */
const IC={
 cart:'<path d="M3 4h3l2.4 11h9.7l2-8H7"/><circle cx="9.5" cy="19.5" r="1.6"/><circle cx="17" cy="19.5" r="1.6"/>',
 box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
 sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 store:'<path d="M4 9 5.5 4h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0M10 20v-6h4v6"/>',
 ai:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 hand:'<path d="M8 12V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8c0 4-2.5 7-6.5 7-3 0-4.5-1.5-6-4.5L3.5 13a1.5 1.5 0 0 1 2.600-1.200L8 14"/>',
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-7"/>',
 tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
 truck:'<path d="M2 6h12v10H2zM14 10h4l4 3v3h-8"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 db:'<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13M4.5 12c0 1.7 3.400 3 7.500 3s7.500-1.300 7.500-3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M19.100 4.900 17 7M7 17l-2.100 2.100"/>',
 bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l1.500 2h-15zM10 21h4"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 search:'<circle cx="11" cy="11" r="6.500"/><path d="m16 16 5 5"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 heart:'<path d="M12 20S4 15 4 9.500A4.500 4.500 0 0 1 12 7a4.500 4.500 0 0 1 8 2.500C20 15 12 20 12 20z"/>',
};
function icon(name,color,sw){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="'+(color||'#fff')+'" stroke-width="'+(sw||1.9)+'" stroke-linecap="round" stroke-linejoin="round">'+(IC[name]||IC.gear)+'</svg>';}

/* ================= CHAT ================= */
function bChat(cfg,root){
  const bar=$('div','bar',root);
  const av=$('div','avatar',bar,icon(cfg.icon||'store','#fff',1.8));
  const tt=$('div','',bar,'<div class="t">'+cfg.title+'</div><div class="s">'+(cfg.sub||'')+'</div>');
  $('span','dot',bar);
  const area=$('div','',root); area.style.cssText='position:absolute;left:0;top:96px;width:960px;height:594px;overflow:hidden';
  const col=$('div','',area); col.style.cssText='position:absolute;left:0;top:0;width:960px;height:2000px';
  const items=[]; let y=18;
  cfg.msgs.forEach(m=>{
    let el, h, x;
    if(m.from==='sys'){
      el=$('div','sys',col,m.text); el.style.visibility='hidden';
      h=el.offsetHeight; x=(960-el.offsetWidth)/2;
    } else {
      el=$('div','msg '+m.from,col,m.text+(m.meta?'<span class="meta">'+m.meta+'</span>':'')); el.style.visibility='hidden';
      h=el.offsetHeight; x=m.from==='c'?(960-34-el.offsetWidth):34;
    }
    el.style.left=x+'px'; el.style.top=y+'px';
    const it={m,el,y,h,ts:L0(m.at)+(m.d||0)};
    if(m.from==='b'){
      const ty=$('div','typing',col,'<i></i><i></i><i></i>'); ty.style.left='34px'; ty.style.top=y+'px'; ty.style.visibility='hidden';
      it.ty=ty; it.tyH=ty.offsetHeight;
    }
    items.push(it); y+=h+14;
  });
  items.forEach(it=>{
    it.ty&&(it.ty.style.display='none');
    it.need=Math.max(0,it.y+it.h+24-594);
    it.start=it.ty?it.ts-0.95:it.ts;
  });
  return {seek(t){
    items.forEach(it=>{
      const a=prog(t,it.ts,0.38);
      ss(it.el,'visibility',a>0?'visible':'hidden');
      ss(it.el,'opacity',f2(clamp(a*1.4)));
      ss(it.el,'transform','translateY('+f1((1-EO(a))*26)+'px) scale('+f2(0.96+0.04*EO(a))+')');
      if(it.ty){
        const on=t>=it.ts-0.95&&t<it.ts;
        ss(it.ty,'display',on?'flex':'none'); ss(it.ty,'visibility',on?'visible':'hidden');
        if(on){ const ds=it.ty.children; for(let i=0;i<3;i++){ ss(ds[i],'opacity',f2(0.35+0.65*Math.max(0,Math.sin((t*7)-i*0.9)))); } }
      }
    });
    // плавний скрол: від need попереднього повідомлення до need поточного
    let k=-1; items.forEach((it,i)=>{ if(t>=it.start) k=i; });
    let off=0;
    if(k>=0){ const prev=k>0?items[k-1].need:0; off=prev+(items[k].need-prev)*EO(prog(t,items[k].start,0.45)); }
    ss(col,'transform','translateY('+f1(-off)+'px)');
  }};
}

/* ================= FUNNEL ================= */
function bFunnel(cfg,root){
  const bar=$('div','bar',root);
  $('div','',bar,'<div class="t">'+cfg.title+'</div>');
  const ri=$('div','right',bar,cfg.right||'демо');
  const rows=[]; const gap=14;
  const rh=Math.max(92,Math.min(140,Math.floor(560/cfg.rows.length)-gap));
  cfg.rows.forEach((r,i)=>{
    const el=$('div','row'+(r.bad?' bad':'')+(r.good?' good':''),root,
      '<div><div class="l">'+r.label+'</div><div class="n">'+(r.note||'')+(r.auto?' <u>· '+r.auto+'</u>':'')+'</div></div>');
    el.style.top=(114+i*(rh+gap))+'px'; el.style.height=rh+'px';
    rows.push({el,t:L0(r.at)+(r.d||0),y:114+i*(rh+gap)+rh/2});
  });
  const tk=$('div','token',root,'<span style="width:34px;height:34px;display:inline-block">'+icon('user','#fff',2)+'</span><span>'+cfg.token.name+' · '+cfg.token.sum+'</span>');
  return {seek(t){
    rows.forEach((r,i)=>{
      const a=prog(t,r.t,0.4);
      ss(r.el,'opacity',f2(a)); ss(r.el,'transform','translateX('+f1((1-EO(a))*-60)+'px)');
    });
    // позиція жетона
    let y=rows[0].y, shown=0;
    for(let i=0;i<rows.length;i++){ if(t>=rows[i].t) shown=i; }
    if(t<rows[0].t+0.2){ y=rows[0].y; }
    else{
      const from=rows[Math.max(0,shown-1)].y, to=rows[shown].y;
      const p=EIO(prog(t,rows[shown].t+0.3,0.65));
      y= shown===0? rows[0].y : from+(to-from)*p;
    }
    const ta=prog(t,rows[0].t+0.1,0.35);
    ss(tk,'opacity',f2(ta)); ss(tk,'top',f1(y-42)+'px');
    ss(tk,'transform','scale('+f2(0.9+0.1*EB(ta))+')');
  }};
}

/* ================= FLOW (схема Make) ================= */
function bFlow(cfg,root){
  const bar=$('div','bar',root);
  $('div','',bar,'<div class="t">'+cfg.title+'</div><div class="s">'+(cfg.sub||'')+'</div>');
  const cnt=(cfg.counter===false||cfg.manual)?null:$('div','right',bar,'операцій: 0');
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',960);svg.setAttribute('height',690);svg.style.cssText='position:absolute;left:0;top:0';
  root.appendChild(svg);
  const fan=cfg.layout==='fan';
  const nAll=fan?(cfg.src.length+cfg.dst.length+1):cfg.nodes.length;
  const D=fan?88:(nAll<=3?104:nAll===4?92:nAll===5?80:68);
  const nodes=[], links=[];
  function mk(n,cx,cy,cls,side){
    const el=$('div','node '+cls,root,icon(n.icon||'gear','#fff',1.9));
    el.style.width=D+'px'; el.style.height=D+'px';
    el.style.left=(cx-D/2)+'px'; el.style.top=(cy-D/2)+'px';
    const lab=$('div','nlabel',root,n.label+(n.sub?'<span class="nsub">'+n.sub+'</span>':''));
    if(side==='right'){
      const L=cx+D/2+16, hh=Math.max(D-8,n.sub?86:0);
      lab.style.cssText+=';left:'+L+'px;top:'+(cy-hh/2)+'px;width:'+(926-L)+'px;height:'+hh+'px;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:0 26px;background:#F6F2EA;border-radius:26px';
    }
    else { lab.style.left=(cx-100)+'px'; lab.style.top=(cy+D/2+6)+'px'; lab.style.width='200px'; lab.style.fontSize='34px'; }

let MC=null;
function tw(txt,fs,wt){ MC=MC||document.createElement('canvas').getContext('2d'); MC.font=(wt||800)+' '+fs+'px InterX'; return MC.measureText(txt).width; }
function fitText(text,maxW,maxLines,fsMax,fsMin,wt,upper){
  const words=(upper?text.toUpperCase():text).split(/\s+/).filter(Boolean);
  let best=null;
  for(let fs=fsMax;fs>=fsMin;fs-=4){
    const lines=[]; let cur='';
    words.forEach(w=>{ const t=cur?cur+' '+w:w; if(cur&&tw(t,fs,wt)>maxW){lines.push(cur);cur=w;} else cur=t; });
    if(cur) lines.push(cur);
    const widest=Math.max.apply(null,lines.map(l=>tw(l,fs,wt)));
    best={fs,lines};
    if(lines.length<=maxLines && widest<=maxW) return best;
  }
  return best;
}

/* ---------- підписи: короткі фрази, непроказані слова сірі ---------- */
function parseUnits(text){
  const units=[];
  text.split('*').forEach((seg,pi)=>{
    const acc=pi%2===1, ws=seg.split(/\s+/).filter(Boolean);
    if(acc){ if(ws.length) units.push({words:ws,kw:true,adj:false}); }
    else ws.forEach((w,wi)=>units.push({words:[w],kw:false,adj:(wi===0&&pi>0&&!/^\s/.test(seg))}));
  });
  return units;
}
function chunkify(units){
  const chunks=[]; let cur=[],len=0,wc=0;
  units.forEach((u,i)=>{
    cur.push(u); const t=u.words.join(' '); len+=t.length+1; wc+=u.words.length;
    const nxt=units[i+1];
    if(nxt&&nxt.adj) return;
    if(/[,:;—?!.…]$/.test(t)||len>=24||wc>=4){ chunks.push(cur); cur=[]; len=0; wc=0; }
  });
  if(cur.length){
    const t=cur.map(u=>u.words.join(' ')).join(' ');
    if(chunks.length&&t.length<=5) chunks[chunks.length-1].push.apply(chunks[chunks.length-1],cur); else chunks.push(cur);
  }
  return chunks;
}
function buildLineCaps(text,t0,d){
  const chunks=chunkify(parseUnits(text));
  const allWords=[]; chunks.forEach(ch=>ch.forEach(u=>u.words.forEach(w=>allWords.push(w.length))));
  const total=allWords.reduce((s,l)=>s+l+1,0), dd=Math.max(0.6,d*0.9);
  let cum=0, out=[];
  chunks.forEach(ch=>{
    const el=$('div','chunk',elCap); const words=[], groups=[];
    ch.forEach(u=>{
      let host=el, kwEl=null;
      if(u.kw){ kwEl=$('span','kw',el); host=kwEl; groups.push({el:kwEl,words:[]}); }
      u.words.forEach(w=>{
        const sp=$('span','w'+(u.adj?' adj':''),host,w.replace(/&/g,'&amp;'));
        const wt=t0+0.04+(cum/total)*dd; cum+=w.length+1;
        const o={el:sp,wt}; words.push(o); if(u.kw) groups[groups.length-1].words.push(o);
      });
      if(u.kw){ const bx=$('i','bx',kwEl,'<b></b><b></b><b></b><b></b>'); groups[groups.length-1].bx=bx; }
    });
    const fsz=ch.reduce((s,u)=>s+u.words.join(' ').length+1,0);
    el.style.fontSize=(fsz>22?56:62)+'px';
    out.push({el,words,groups,start:words[0].wt});
  });
  return out;
}

  CAPS=CFG.lines.map((ln,i)=>buildLineCaps(ln,TL.lines[i].t0,TL.lines[i].d));
  // герой
  POSES=planPoses(nl,SEED); POSEIMG={};
  POSES.forEach(p=>{ if(!POSEIMG[p]){ const im=document.createElement('img'); im.src='ch_'+p+'.webp'; im.style.opacity='0'; elChar.appendChild(im); POSEIMG[p]=im; } });
  // біти
  B.cover=buildCover(CFG.lines[0]);
  B.slam=buildSlam(firstAccent(CFG.lines[0])||plain(CFG.lines[0]).split(' ').slice(0,3).join(' '));
  if(HAS_PUNCH) B.punch=buildPunch(firstAccent(CFG.lines[1]),SEED%2);
  B.stageRoot=mkBeat(); const st=$('div','abs',B.stageRoot); st.id='stage'; B.stage=st;
  B.stageRoot.style.display='block';
  const bd=BUILD[CFG.scene]; SCENE=bd?bd(CFG.cfg,st):null;
  B.stageRoot.style.display='';
  const ck=CFG.cta&&CFG.cta.key;
  B.cta=buildCta(ck, CFG.cta&&CFG.cta.say);
  window.READY=Promise.all(Object.values(POSEIMG).map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve()));
  seek(0);
}

/* ---------- ефект переходу між бітами ---------- */
function fxApply(el,t,ts,te,opt){
  opt=opt||{};
  const inP=opt.noIn?1:EO(prog(t,ts-0.05,opt.inD||0.42)), outP=opt.noOut?0:EIO(prog(t,te-0.16,0.22));
  const vis=(t>=ts-0.05)&&(t<te+0.06);
  ss(el,'display',vis?'block':'none');
  if(!vis) return 0;
  const blur=(1-inP)*26+outP*22, sc=1+(1-inP)*0.07-outP*0.05, tx=(1-inP)*(opt.dir||90)-outP*70, op=inP*(1-outP);
  ss(el,'opacity',f2(op));
  ss(el,'filter',blur>0.3?'blur('+f1(blur)+'px)':'none');
  ss(el,'transform',(opt.pre||'')+'translateX('+f1(tx)+'px) scale('+f2(sc)+')');
  return inP;
}

const COV_T=0.9; // обкладинка-хук: кадр 0 готовий, до COV_T тримається, далі «віп» у слем
const CHAR_COV={x:760,h:980};
const CHAR_ST={slam:{x:790,h:790},punch:{x:790,h:680},panel:{x:540,h:640},cta:{x:790,h:800}};
function beatName(k){ if(k===0)return'slam'; if(k===LAST)return'cta'; if(HAS_PUNCH&&k===1)return'punch'; return'panel'; }
function cursorAt(t,pts){ // pts: [{t,x,y}], лінійно з EIO
  if(t<=pts[0].t) return pts[0];
  for(let i=1;i<pts.length;i++){ if(t<=pts[i].t){ const p=EIO(prog(t,pts[i-1].t,pts[i].t-pts[i-1].t)); return {x:lerp(pts[i-1].x,pts[i].x,p),y:lerp(pts[i-1].y,pts[i].y,p)}; } }
  return pts[pts.length-1];
}

function seek(t){
  DIRTY=false;
  const nl=LAST+1;
  let k=0; for(let i=0;i<nl;i++){ if(t>=TL.lines[i].t0-0.02) k=i; }
  const tSlam0=0, tSlam1=L0(1), tP1=HAS_PUNCH?L0(2):tSlam1, tc=L0(LAST), tEnd=tc+TL.lines[LAST].d+2;
  // ---- підписи
  CAPS.forEach((chs,i)=>{
    let act=-1;
    if(i===k){ chs.forEach((c,j)=>{ if(t>=c.start-0.06) act=j; }); }
    chs.forEach((c,j)=>{
      const on=(j===act)&&!(i===0&&t<COV_T-0.05);
      ss(c.el,'display',on?'block':'none');
      if(!on) return;
      const p=EO(prog(t,Math.max(c.start,(i===0?COV_T:0))-0.06,0.22));
      ss(c.el,'opacity',f2(p)); ss(c.el,'transform','translateY('+f1((1-p)*14)+'px)');
      ss(c.el,'filter',p<1?'blur('+f1((1-p)*8)+'px)':'none');
      c.words.forEach(w=>{ const q=EO(prog(t,w.wt-0.02,0.2)); ss(w.el,'color',mix(GRAY,INK,q)); });
      c.groups.forEach(g=>{
        const lt=Math.max.apply(null,g.words.map(w=>w.wt));
        const ba=EB(prog(t,lt+0.12,0.34));
        ss(g.bx,'opacity',f2(clamp(ba*1.3))); ss(g.bx,'transform','scale('+f2(1.2-0.2*ba)+')');
      });
    });
  });
  // ---- фон, що дихає
  ss(elFog1,'transform','translate('+f1(40+30*Math.sin(t*0.5))+'px,'+f1(60+25*Math.cos(t*0.4))+'px)');
  ss(elFog2,'transform','translate('+f1(480+40*Math.cos(t*0.45))+'px,'+f1(1000+30*Math.sin(t*0.5))+'px)');
  // ---- СЛЕМ
  const S=B.slam;
  const CV=B.cover;
  fxApply(CV.root,t,-0.05,COV_T,{noIn:true,dir:0,outD:0.2});
  if(t<COV_T+0.1){ CV.sparks.forEach((sp,i)=>{ ss(sp,'opacity',f2(0.6+0.4*Math.sin(t*3+i))); ss(sp,'transform','rotate('+f1(t*60+i*40)+'deg)'); }); ss(CV.ring,'transform','scale('+f2(1+0.02*Math.sin(t*2))+')'); }
  fxApply(S.root,t,COV_T,tSlam1,{inD:0.5,dir:0});
  if(t<tSlam1+0.1){
    const ts=Math.max(COV_T+0.25,L0(0)+0.45);
    const rp=EB(prog(t,COV_T+0.05,0.8)); ss(S.ring,'transform','scale('+f2(0.6+0.4*rp)+')'); ss(S.ring,'opacity',f2(clamp(rp*1.4)));
    S.lines.forEach((ln,i)=>{
      const a=prog(t,ts+0.14*i,0.45), e=EB(a);
      ss(ln,'opacity',f2(clamp(a*1.6))); ss(ln,'transform','scale('+f2(0.72+0.28*e)+') rotate('+f1((1-e)*-3)+'deg)');
      ss(ln,'filter',a<1?'blur('+f1((1-a)*14)+'px)':'none');
    });
    S.sparks.forEach((sp,i)=>{ const a=prog(t,ts+0.3+0.12*i,0.4); ss(sp,'opacity',f2(clamp(a*1.5)*(0.6+0.4*Math.sin(t*3+i)))); ss(sp,'transform','rotate('+f1(t*60+i*40)+'deg) scale('+f2(0.4+0.6*EB(a))+')'); });
  }
  // ---- УДАР (punch)
  if(B.punch){
    const P=B.punch;
    fxApply(P.root,t,tSlam1,tP1,{inD:0.42});
    if(t>=tSlam1-0.1&&t<tP1+0.2){
      const a=prog(t,tSlam1+0.12,0.55), e=EB(a);
      const sq=P.variant?1:(1-0.07*Math.sin(Math.PI*clamp(prog(t,tSlam1+1.45,0.3))));
      ss(P.el,'transform','scale('+f2((0.55+0.45*e)*sq)+')'); ss(P.el,'opacity',f2(clamp(a*1.6)));
      ss(P.ring,'transform','scale('+f2(1+0.04*Math.sin(t*3))+')');
      if(P.bar){ const w=EIO(prog(t,tSlam1+0.7,0.7)); ss(P.bar,'transform','scaleX('+f2(w)+')'); ss(P.bar,'opacity',f2(w>0?1:0)); }
      // курсор і клік
      const tcl=tSlam1+1.45;
      if(!P.variant){
        const rp=prog(t,tcl,0.55);
        ss(P.rip,'opacity',f2(rp>0&&rp<1?1-rp:0));
        const rs=P.w*(0.5+0.9*rp);
        ss(P.rip,'left',f1(540-rs/2)+'px'); ss(P.rip,'top',f1(P.cy-rs/2)+'px'); ss(P.rip,'width',f1(rs)+'px'); ss(P.rip,'height',f1(rs)+'px');
      }
    }
  }
  // ---- ПАНЕЛЬ
  const stT0=HAS_PUNCH?L0(2):L0(1);
  const inP=fxApply(B.stageRoot,t,stT0,tc,{inD:0.5,dir:70});
  if(t>=stT0-0.1&&t<tc+0.1){
    const lift=EO(prog(t,stT0-0.05,0.55));
    const zoom=1+0.05*prog(t,stT0,tc-stT0);
    ss(B.stage,'transform','perspective(1500px) rotateX('+f1((1-lift)*9)+'deg) translateY('+f1((1-lift)*60)+'px) scale('+f2(zoom)+')');
    if(SCENE) SCENE.seek(t);
  }
  // ---- CTA
  const C=B.cta;
  fxApply(C.root,t,tc,tEnd,{inD:0.5,noOut:true});
  if(t>=tc-0.1){
    const a=EB(prog(t,tc+0.15,0.6));
    ss(C.card,'transform','scale('+f2(0.8+0.2*a)+')'); ss(C.card,'opacity',f2(clamp(a*1.5)));
    const tcl=tc+TL.lines[LAST].d*0.8;
    const done=t>=tcl+0.1;
    ss(C.btn,'background',done?'#1FA97A':'#DE4B20');
    const cl=Math.sin(Math.PI*clamp(prog(t,tcl-0.05,0.3)));
    ss(C.btn,'transform','scale('+f2(1-0.06*cl)+')');
    sh(C.btn,done?(C.ck+'<span>Надіслано</span>'):(C.ar+'<span>'+C.lbl+'</span>'));
  }
  // ---- курсор
  let cur=null;
  if(B.punch&&!B.punch.variant&&t>=tSlam1&&t<tP1+0.1){
    const tcl=tSlam1+1.45;
    cur=cursorAt(t,[{t:tSlam1+0.2,x:1010,y:1500},{t:tcl,x:600,y:B.punch.cy+30}]);
    cur.sq=1-0.1*Math.sin(Math.PI*clamp(prog(t,tcl,0.25))); cur.op=clamp(prog(t,tSlam1+0.2,0.25))*(1-prog(t,tP1-0.2,0.2));
  } else if(t>=tc){
    const tcl=tc+TL.lines[LAST].d*0.8;
    cur=cursorAt(t,[{t:tc+0.3,x:1000,y:1450},{t:tcl,x:640,y:860}]);
    cur.sq=1-0.1*Math.sin(Math.PI*clamp(prog(t,tcl,0.25))); cur.op=clamp(prog(t,tc+0.3,0.25));
  }
  if(cur){ ss(elCursor,'display','block'); ss(elCursor,'opacity',f2(cur.op)); ss(elCursor,'left',f1(cur.x)+'px'); ss(elCursor,'top',f1(cur.y)+'px'); ss(elCursor,'transform','scale('+f2(cur.sq)+')'); }
  else ss(elCursor,'display','none');
  // ---- герой
  const t0k=TL.lines[k].t0, cs=CHAR_ST[beatName(k)], ps=CHAR_ST[beatName(Math.max(0,k-1))];
  const mv=EIO(prog(t,t0k-0.05,0.5));
  const mc=EIO(prog(t,COV_T-0.1,0.55));
  const cx=k===0?lerp(CHAR_COV.x,cs.x,mc):lerp(ps.x,cs.x,mv), ch=k===0?lerp(CHAR_COV.h,cs.h,mc):lerp(ps.h,cs.h,mv);
  const enter=1;
  const sw=prog(t,t0k-0.02,0.2), cur2=POSES[k];
  Object.keys(POSEIMG).forEach(name=>{
    const im=POSEIMG[name]; let o=0;
    if(name===cur2) o=(k===0)?1:sw; else if(k>0&&name===POSES[k-1]) o=1-sw;
    ss(im,'opacity',f2(o*enter));
  });
  const hop=(k>0)?Math.sin(Math.PI*prog(t,t0k,0.3))*10:0;
  const sc=ch/760, breath=1+0.006*Math.sin(t*2.1);
  ss(elChar,'left',f1(cx-350)+'px'); ss(elChar,'top',f1(1890-760-hop+(1-enter)*150)+'px');
  ss(elChar,'transform','scale('+sc.toFixed(4)+','+(sc*breath).toFixed(4)+')');
  ss(elShadow,'left',f1(cx-170*sc)+'px'); ss(elShadow,'top','1868px'); ss(elShadow,'transform','scale('+sc.toFixed(3)+')'); ss(elShadow,'opacity',f2(enter));
  return DIRTY;
}

const BUILD={chat:bChat,funnel:bFunnel,flow:bFlow,stats:bStats,card:bCard};
window.START=START; window.seek=seek;
</script>

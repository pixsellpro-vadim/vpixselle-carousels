<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>talk scenes v1</title>
<style>
@font-face{font-family:"InterX";src:url("Inter-SemiBold.otf");font-weight:600;}
@font-face{font-family:"InterX";src:url("Inter-ExtraBold.otf");font-weight:800;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#071E3D}
body{font-family:"InterX","Inter",sans-serif;font-weight:600;color:#14233F;position:relative}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;
 background:radial-gradient(900px 900px at 80% 10%,#2C7DEB,rgba(44,125,235,0) 70%),radial-gradient(900px 900px at 0% 60%,#6A3FD8,rgba(106,63,216,0) 65%),linear-gradient(170deg,#1D6FD8,#0A4B8F 55%,#071E3D)}
.bd{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;will-change:transform,opacity}
.pnl{position:absolute;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.abs{position:absolute}
.t{position:absolute;white-space:nowrap}
#bds{position:absolute;left:0;top:0;width:1080px;height:1920px;isolation:isolate}
#fx{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;pointer-events:none}
#fx>div{will-change:transform}
#hud{position:absolute;left:0;top:0;width:1080px;height:200px;pointer-events:none}
#shade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:linear-gradient(180deg,rgba(7,30,61,0) 0,rgba(7,30,61,0) 52%,rgba(7,30,61,.78) 78%,rgba(7,30,61,.95) 100%);pointer-events:none}
#char{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#char img{position:absolute;display:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));transform-origin:50% 100%}
#marks{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#cap{position:absolute;left:20px;top:820px;width:1040px;height:210px;display:flex;align-items:center;justify-content:center;text-align:center}
.ch{display:none;font-size:98px;font-weight:800;text-transform:uppercase;line-height:1.08;letter-spacing:-1px}
.ch .w{display:inline-block;padding:0 .26em;color:#fff;transform-origin:50% 70%;white-space:nowrap;-webkit-text-stroke:11px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.55)}
.ch .w.on{color:#FFD21F}
.ch .w.ac{color:#46F08C}
#flash{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0;display:none;pointer-events:none}
.stk{position:absolute;background:#fff;color:#0B0B0E;border-radius:22px;text-align:center;font-weight:800;box-shadow:0 22px 60px rgba(0,0,0,.5);text-transform:uppercase;line-height:1.04;border:6px solid #0B0B0E}
.stk small{display:block;font-size:30px;letter-spacing:3px;color:#666;margin-bottom:6px}
.stk.red{background:#FF3B30;color:#fff;border-color:#fff}
#cover{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.cvt{position:absolute;left:50px;width:980px;text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:-2px;line-height:1.02;color:#fff;-webkit-text-stroke:16px #000;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.5)}
.cvt .g{color:#FFD21F}
.chip{position:absolute;background:#FFD21F;color:#0B0B0E;font-weight:800;border-radius:16px;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
<div id="world">
 <div id="fx"></div>
 <div id="bds"></div>
 <div id="shade"></div>
 <div id="marks"></div>
 <div id="char"></div>
 <div id="stks"></div>
 <div id="cap"></div>
 <div id="hud"></div>
 <div id="flash"></div>
 <div id="cover"></div>
</div>
<script>
let DIRTY=false;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const EO=x=>1-Math.pow(1-x,3);
const EIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const EB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const hl=s=>esc(s).replace(/\*(.+?)\*/g,'<span class="g">$1</span>').replace(/\n/g,'<br>');
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const tf=(x=0,y=0,s=1,r=0)=>`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
function mk(cls,html,parent,css){const e=document.createElement('div');if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(css)e.style.cssText=css;if(parent)parent.appendChild(e);e._base=e.style.cssText?e.style.cssText.replace(/;?\s*$/,';'):'';return e}
function st(e,o){let s='';for(const k in o)s+=k+':'+o[k]+';';if(e._c!==s){e._c=s;e.style.cssText=(e._base||'')+s;DIRTY=true}}
function rtimes(n,dur,start,endFrac,minStep,maxStep){start=start==null?.4:start;endFrac=endFrac||.8;minStep=minStep||.3;maxStep=maxStep||1.1;
 const span=Math.max(dur*endFrac-start,.5),step=clamp(span/Math.max(n,1),minStep,maxStep);return Array.from({length:n},(_,i)=>start+i*step)}
const pop=(lt,a,d)=>EB(prog(lt,a,d||.42));
const AV=['#FF7A59','#7A5CFF','#18B6A4','#F5B301','#E5489B','#3B82F6','#6B7280','#22C55E'];

/* ========== тла: екрани-макети ========== */
const BG={};
// Інстаграм-директ
BG.dm=(D,dur)=>{
 const r=mk('bd');mk('pnl','',r,'left:40px;top:110px;width:1000px;height:1480px;border-radius:60px');
 mk('t','Повідомлення',r,'left:90px;top:160px;font-size:68px;font-weight:800;color:#111');
 mk('t','Основні',r,'left:92px;top:262px;font-size:34px;color:#111;border-bottom:6px solid #111;padding-bottom:6px');
 mk('t','Запити',r,'left:290px;top:262px;font-size:34px;color:#9aa0aa');
 const rows=D.rows||[],n=rows.length,rt=rtimes(n,dur,.35,.75,.35,.9),el=[],anc={};
 rows.forEach((o,i)=>{const y=340+i*150;const c=mk('',null,r,`position:absolute;left:60px;top:${y}px;width:960px;height:140px`);
  mk('',null,c,`position:absolute;left:20px;top:20px;width:100px;height:100px;border-radius:50%;background:${AV[i%8]}`);
  mk('t',esc(o.n),c,`left:150px;top:24px;font-size:42px;font-weight:800;color:#111`);
  mk('t',esc(o.t),c,`left:150px;top:80px;font-size:34px;color:${o.u?'#111':'#8a8f99'};${o.u?'font-weight:800':''}`);
  mk('t',esc(o.time||''),c,'right:56px;top:30px;font-size:30px;color:#9aa0aa');
  const dot=mk('',null,c,'position:absolute;right:20px;top:90px;width:26px;height:26px;border-radius:50%;background:#2F7BFF;'+(o.u?'':'display:none'));
  el.push({c,dot,u:o.u});anc['row'+i]={x:60,y,w:960,h:140}});
 let bd=null;if(D.badge!=null){bd=mk('',String(D.badge),r,'position:absolute;right:90px;top:160px;min-width:96px;height:96px;border-radius:48px;background:#FF3B30;color:#fff;font-size:56px;font-weight:800;text-align:center;line-height:96px;padding:0 24px');anc.badge={x:830,y:160,w:150,h:96}}
 return{root:r,anc,ev:rt.map(x=>({t:x,k:'pop'})),upd(lt){
  el.forEach((o,i)=>{const p=pop(lt,rt[i],.4);st(o.c,{opacity:clamp(p*2.5),transform:tf((1-p)*260,0,1,0)})});
  if(bd){const p=pop(lt,rt[0]||.3,.4);const v=Math.round(D.badge*clamp((lt-.3)/Math.max(rt[n-1]||1,1)));bd.textContent=v;st(bd,{transform:tf(0,0,.6+.4*p+.06*Math.sin(lt*8),0)})}}}};
// CRM-канбан
BG.kanban=(D,dur)=>{
 const r=mk('bd');mk('pnl','',r,'left:20px;top:110px;width:1040px;height:1480px;border-radius:56px;background:#F1F4FA');
 const cols=D.cols||['Нова заявка','В роботі','Оплачено'];const cc=['#2F7BFF','#F5B301','#22C55E'];const anc={};
 cols.forEach((nm,i)=>{const x=40+i*334;mk('',null,r,`position:absolute;left:${x}px;top:150px;width:310px;height:1400px;border-radius:36px;background:#E3E8F3`);
  mk('t',esc(nm),r,`left:${x+24}px;top:176px;font-size:36px;font-weight:800;color:#111`);mk('',null,r,`position:absolute;left:${x+24}px;top:236px;width:90px;height:10px;border-radius:5px;background:${cc[i]}`);
  anc['col'+i]={x,y:150,w:310,h:560}});
 const cards=D.cards||[],cnt=[0,0,0],pos=[];
 cards.forEach((o,i)=>{pos.push({col:o.col,slot:cnt[o.col]++})});
 const mv=(D.moves||[]);const dest=[0,0,0];cards.forEach(o=>dest[o.col]++);
 mv.forEach(m=>{m.slot=dest[m.to]++});
 const rt=rtimes(cards.length,dur,.35,.55,.25,.6),el=[];
 cards.forEach((o,i)=>{const c=mk('',null,r,'position:absolute;left:0;top:0;width:286px;height:200px;background:#fff;border-radius:26px;box-shadow:0 10px 26px rgba(20,35,63,.18)');
  mk('t',esc(o.t),c,'left:22px;top:26px;font-size:38px;font-weight:800;color:#111;max-width:250px');
  mk('t',esc(o.s||''),c,'left:22px;top:84px;font-size:28px;color:#8a8f99');
  mk('chip',esc(o.tag||'Директ'),c,'left:22px;top:130px;font-size:24px;padding:6px 14px;background:#E6EEFF;color:#2F7BFF');
  el.push(c);anc['card'+i]={x:44+pos[i].col*334,y:270+pos[i].slot*220,w:286,h:200}});
 const at=(i,t)=>{let col=pos[i].col,slot=pos[i].slot,p=1;mv.forEach(m=>{if(m.i===i){const q=EIO(prog(t,m.t,.5));if(q>0){const fx=44+col*334,fy=270+slot*220,tx=44+m.to*334,ty=270+m.slot*220;col=-1;slot=[lerp(fx,tx,q),lerp(fy,ty,q)-Math.sin(q*Math.PI)*60,q]}if(q>=1){col=m.to;slot=m.slot}}});
  if(col===-1)return{x:slot[0],y:slot[1],lift:Math.sin(slot[2]*Math.PI)};return{x:44+col*334,y:270+slot*220,lift:0}};
 return{root:r,anc,ev:rt.map(x=>({t:x,k:'pop'})).concat(mv.map(m=>({t:m.t,k:'whoosh'}))),upd(lt){
  el.forEach((c,i)=>{const p=pop(lt,rt[i],.38);const a=at(i,lt);st(c,{opacity:clamp(p*2.5),transform:`translate(${a.x.toFixed(1)}px,${(a.y+(1-p)*-60).toFixed(1)}px) scale(${(p*(1+.06*a.lift)).toFixed(3)}) rotate(${(a.lift*4).toFixed(2)}deg)`,'z-index':a.lift>0?5:1})})}}};
// таблиця цін
BG.sheet=(D,dur)=>{
 const r=mk('bd');mk('pnl','',r,'left:30px;top:110px;width:1020px;height:1480px;border-radius:40px;overflow:hidden');
 mk('',null,r,'position:absolute;left:30px;top:110px;width:1020px;height:96px;background:#0F9D58;border-radius:40px 40px 0 0');
 ['Товар','Ціна','Залишок'].forEach((s,i)=>mk('t',s,r,`left:${[70,600,830][i]}px;top:132px;font-size:42px;font-weight:800;color:#fff`));
 const rows=D.rows||[],fx=D.fix||[],anc={},rt=rtimes(rows.length,dur,.3,.5,.2,.5),el=[];const HI=fx.map(()=>mk('',null,null,'position:absolute;left:518px;top:8px;width:276px;height:112px;border-radius:14px;background:#FFE14D;opacity:0'));
 rows.forEach((o,i)=>{const y=210+i*128;const c=mk('',null,r,`position:absolute;left:30px;top:${y}px;width:1020px;height:128px;border-bottom:3px solid #E5E7EB;background:${i%2?'#F7F8FA':'#fff'}`);
  mk('t',esc(o.n),c,'left:40px;top:38px;font-size:42px;color:#111');
  const pr=mk('t',esc(o.p),c,'left:570px;top:38px;font-size:44px;font-weight:800;color:#111');
  mk('t',esc(o.s||''),c,'left:800px;top:38px;font-size:42px;color:#6b7280');
  {const fi=fx.findIndex(z=>z.i===i);if(fi>=0){c.insertBefore(HI[fi],c.firstChild)}}
  el.push({c,pr,o});anc['row'+i]={x:30,y,w:1020,h:128};anc['price'+i]={x:590,y:y+10,w:210,h:108}});
 const hi=HI;
 return{root:r,anc,ev:rt.map(x=>({t:x,k:'tick'})).concat(fx.map(f=>({t:f.t,k:'ding'}))),upd(lt){
  el.forEach((o,i)=>{const p=pop(lt,rt[i],.3);st(o.c,{opacity:clamp(p*3),transform:tf(0,(1-p)*30,1,0)});
   const f=fx.find(z=>z.i===i);if(f){const h=prog(lt,f.t-.3,.25)*(1-prog(lt,f.t+1.2,.3));o.pr.textContent=lt>=f.t?f.new:o.o.p;st(o.pr,{color:lt>=f.t?'#0F9D58':(h>0?'#D92D20':'#111'),'text-decoration':(lt<f.t&&h>0)?'line-through':'none'});st(hi[fx.indexOf(f)],{opacity:h.toFixed(2)})}})}}};
// екран блокування зі сповіщеннями
BG.notifs=(D,dur)=>{
 const r=mk('bd');
 mk('t',esc(D.time||'22:14'),r,'left:0;width:1080px;text-align:center;top:110px;font-size:210px;font-weight:800;color:#fff;letter-spacing:-7px;text-shadow:0 10px 40px rgba(0,0,0,.35)');
 mk('t',esc(D.date||'пʼятниця, 18 жовтня'),r,'left:0;width:1080px;text-align:center;top:340px;font-size:42px;color:rgba(255,255,255,.85)');
 const it=D.items||[],n=it.length,rt=rtimes(n,dur,.45,.75,.45,1.0),el=[],anc={};
 const pitch=Math.min(170,Math.floor(400/Math.max(n,1))),H=Math.min(156,pitch-10),ic=Math.round(H*.62),y0=410;
 it.forEach((o,i)=>{const y=y0+i*pitch;const c=mk('',null,r,`position:absolute;left:50px;top:${y}px;width:980px;height:${H}px;border-radius:${Math.round(H*.25)}px;background:rgba(255,255,255,.93);box-shadow:0 14px 40px rgba(0,0,0,.3)`);
  mk('',null,c,`position:absolute;left:24px;top:${Math.round((H-ic)/2)}px;width:${ic}px;height:${ic}px;border-radius:${Math.round(ic*.26)}px;background:${o.ic||'linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)'}`);
  mk('t',esc(o.n),c,`left:${ic+48}px;top:${Math.round(H*.13)}px;font-size:38px;font-weight:800;color:#111`);
  mk('t',esc(o.t),c,`left:${ic+48}px;top:${Math.round(H*.5)}px;font-size:34px;color:#444`);
  mk('t',esc(o.time||'зараз'),c,'right:34px;top:20px;font-size:26px;color:#888');
  el.push(c);anc['n'+i]={x:50,y,w:980,h:H}});
 return{root:r,anc,ev:rt.map(x=>({t:x,k:'ding'})),upd(lt){el.forEach((c,i)=>{const p=pop(lt,rt[i],.5);st(c,{opacity:clamp(p*3),transform:tf(0,(1-p)*-220,.9+.1*p,0)})})}}};
// великий показник
BG.stat=(D,dur)=>{
 const r=mk('bd');mk('pnl','',r,'left:50px;top:200px;width:980px;height:700px;border-radius:64px');
 mk('t',esc(D.label||''),r,'left:0;width:1080px;text-align:center;top:260px;font-size:40px;letter-spacing:4px;color:#6b7280;text-transform:uppercase');
 const txt=(D.prefix||'')+fmt(D.to);const fs=Math.min(280,Math.floor(880/(txt.length*.62)));
 const n=mk('t','',r,`left:0;width:1080px;text-align:center;top:340px;font-size:${fs}px;font-weight:800;color:${D.color==='g'?'#16A34A':'#E5252A'};letter-spacing:-6px`);
 mk('t',esc(D.unit||''),r,'left:0;width:1080px;text-align:center;top:'+(340+fs+10)+'px;font-size:60px;font-weight:800;color:#111');
 if(D.note)mk('t',esc(D.note),r,'left:0;width:1080px;text-align:center;top:'+(340+fs+110)+'px;font-size:32px;color:#8a8f99');
 return{root:r,anc:{num:{x:90,y:340,w:900,h:fs}},ev:[{t:.2,k:'rise'}],upd(lt){const p=EO(prog(lt,.2,Math.min(2.4,dur*.55)));n.textContent=(D.prefix||'')+fmt(D.to*p);st(n,{transform:tf(0,0,1+.03*Math.sin(lt*9)*(p<1?1:0),0)})}}};

// чек-лист: що є / чого бракує
BG.checklist=(D,dur)=>{
 const it=D.items||[],n=it.length,y0=250,pitch=Math.min(176,Math.floor(540/Math.max(n,1))),H=pitch-18,fs=H>=120?44:36,cs=Math.min(108,H-24);
 const r=mk('bd');mk('pnl','',r,`left:40px;top:110px;width:1000px;height:${Math.min(710,y0-110+n*pitch+24)}px;border-radius:56px`);
 mk('t',esc(D.title||'Чек-лист'),r,'left:90px;top:148px;font-size:56px;font-weight:800;color:#111');
 const rt=rtimes(n,dur,.4,.75,.4,.9),el=[],anc={};
 it.forEach((o,i)=>{const y=y0+i*pitch;const ok=o.ok!==false;
  const c=mk('',null,r,`position:absolute;left:60px;top:${y}px;width:960px;height:${H}px;border-radius:34px;background:${ok?'#EAF8EF':'#FDECEC'}`);
  mk('',ok?'✓':'✕',c,`position:absolute;left:26px;top:${Math.round((H-cs)/2)}px;width:${cs}px;height:${cs}px;border-radius:50%;background:${ok?'#22C55E':'#FF3B30'};color:#fff;font-size:${Math.round(cs*.62)}px;font-weight:800;text-align:center;line-height:${cs}px`);
  mk('',esc(o.t),c,`position:absolute;left:${cs+60}px;top:0;width:${900-cs}px;height:${H}px;display:flex;align-items:center;font-size:${fs}px;font-weight:800;color:#111;line-height:1.12`);
  el.push(c);anc['row'+i]={x:60,y,w:960,h:H};anc['ok'+i]={x:60,y,w:960,h:H}});
 return{root:r,anc,ev:rt.map((x,i)=>({t:x,k:(it[i]&&it[i].ok===false)?'tick':'ding'})),upd(lt){el.forEach((c,i)=>{const p=pop(lt,rt[i],.4);st(c,{opacity:clamp(p*3),transform:tf((1-p)*-240,0,1,0)})})}}};
// було / стало
BG.compare=(D,dur)=>{
 const r=mk('bd');
 const cols=[{x:40,h:D.a||'БУЛО',bg:'#FDECEC',hc:'#E5252A',k:'a'},{x:550,h:D.b||'СТАЛО',bg:'#EAF8EF',hc:'#16A34A',k:'b'}];
 const anc={},el=[];
 cols.forEach((c,ci)=>{mk('pnl','',r,`left:${c.x}px;top:130px;width:490px;height:690px;border-radius:50px;background:${c.bg}`);
  mk('t',esc(c.h),r,`left:${c.x}px;width:490px;text-align:center;top:156px;font-size:48px;font-weight:800;letter-spacing:3px;color:${c.hc}`);
  anc['col'+ci]={x:c.x,y:130,w:490,h:260}});
 const A=D.aItems||[],B=D.bItems||[],n=Math.max(A.length,B.length),rt=rtimes(n,dur,.4,.75,.5,1.0);
 const pitch=Math.min(300,Math.floor(540/Math.max(n,1))),H=Math.min(268,pitch-22),fs=H>=200?40:34;
 for(let i=0;i<n;i++){[[A[i],40,'#fff','#E5252A'],[B[i],550,'#fff','#16A34A']].forEach((z,ci)=>{if(!z[0])return;const y=250+i*pitch;
   const c=mk('',esc(z[0]),r,`position:absolute;left:${z[1]+24}px;top:${y}px;width:442px;height:${H}px;border-radius:30px;background:#fff;border:6px solid ${z[3]};display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:${fs}px;font-weight:800;color:#111;line-height:1.15;box-shadow:0 10px 26px rgba(20,35,63,.14)`);
   el.push({c,i,ci});anc['c'+ci+'_'+i]={x:z[1]+24,y,w:442,h:H}})}
 return{root:r,anc,ev:rt.map(x=>({t:x,k:'pop'})),upd(lt){el.forEach(o=>{const p=pop(lt,rt[o.i]+(o.ci?.25:0),.4);st(o.c,{opacity:clamp(p*3),transform:tf((o.ci?1:-1)*(1-p)*200,0,.9+.1*p,0)})})}}};
// пошукова видача
BG.serp=(D,dur)=>{
 const r=mk('bd');mk('pnl','',r,'left:40px;top:110px;width:1000px;height:1480px;border-radius:60px');
 mk('',null,r,'position:absolute;left:80px;top:160px;width:920px;height:110px;border-radius:55px;background:#F1F3F4;border:3px solid #DADCE0');

  o.mk.forEach(m=>{const d=prog(lt,m.t,m.dd);if(d>0&&t<o.e){m.path.style.strokeDasharray='1';m.path.style.strokeDashoffset=(1-EO(d)).toFixed(3);st(m.svg,{display:'block',opacity:1})}else st(m.svg,{display:'none'})});
  if(o.cur){const c=o.cur,p=EIO(prog(lt,c.t-.62,.55)),press=prog(lt,c.t-.05,.12)*(1-prog(lt,c.t+.07,.12));
   const cx=c.ax+(1-p)*320+Math.sin(lt*7)*(1-p)*18,cy=c.ay+(1-p)*420;
   st(c.e,{opacity:(clamp((lt-(c.t-.75))*5)*(1-prog(lt,c.t+.55,.25))).toFixed(2),transform:`translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px) scale(${(1-.14*press).toFixed(3)}) rotate(-8deg)`});
   const rp=prog(lt,c.t,.5);st(c.rp,{opacity:rp>0&&rp<1?((1-rp)*.85).toFixed(2):0,transform:tf(0,0,.35+1.5*EO(rp),0)})}
  if(o.burst){const b=o.burst;b.ps.forEach((e,k)=>{const dt=lt-b.t-k*.025;if(dt<0||dt>1.4){st(e,{opacity:0});return}
   const ang=-Math.PI/2+(rnd(k,i+4)-.5)*2.4,sp=420+rnd(k,i+9)*520;const px=b.x+Math.cos(ang)*sp*dt,py=b.y+Math.sin(ang)*sp*dt+620*dt*dt;
   st(e,{opacity:(1-dt/1.4).toFixed(2),transform:`translate(${(px-32).toFixed(1)}px,${(py-32).toFixed(1)}px) scale(${(.6+.7*EO(dt*3)).toFixed(2)}) rotate(${((rnd(k,3)-.5)*60+dt*80).toFixed(0)}deg)`})})}
  // персонаж: безпечні поля, подих, «підбивання» на акцентних словах, зміна пози
  const side=o.flip?'L':'R',useB=lt>=o.swap;
  const cur=useB?o.imgB:o.imgA,oth=useB?o.imgA:o.imgB,pkc=useB?o.pkB:o.pkA;
  const im=S.imgs[pkc],asp=im&&im.naturalWidth?im.naturalWidth/im.naturalHeight:.4;const hh=parseFloat(cur._base.match(/height:(\d+)/)[1]);const w=hh*asp;
  const ep=EB(prog(t,o.s+.05,.45)),eq=EIO(prog(t,o.e-.15,.2));
  const off=(1-ep)*(side==='R'?520:-520)+eq*(side==='R'?520:-520);
  let pl=0;for(const wt of o.wt){const d=t-wt;if(d>=0&&d<.4)pl+=Math.exp(-d*10)}pl=Math.min(pl,1.25);
  const breath=1+.012*Math.sin(t*2.7+i),sway=Math.sin(t*1.5+i)*1.5+pl*(i%2?-1:1)*.9;
  const hop=o.swap<1e8?Math.sin(clamp((lt-o.swap)/.34)*Math.PI)*56:0;
  const entryS=1+.07*Math.sin(clamp((t-o.s-.05)/.45)*Math.PI);
  const left=(side==='R'?1080-SAFE_R-w:SAFE_L);
  const tfm=`translate(${off.toFixed(1)}px,${(Math.sin(t*3.1+i)*5-pl*14-hop).toFixed(1)}px) rotate(${sway.toFixed(2)}deg) scale(${((1+.03*pl)*(o.flip?-1:1)).toFixed(3)},${((1+.03*pl)*breath*entryS).toFixed(3)})`;
  st(cur,{display:'block',left:left+'px',top:(1950-hh)+'px',transform:tfm,opacity:clamp(ep*3)});
  st(oth,{display:'none'});
  if(o.big){const bp=EB(prog(lt,o.big.t,.32));if(lt>=o.big.t&&t<o.e)st(o.big.e,{display:'block',opacity:(clamp(bp*3)*mo).toFixed(2),transform:tf(0,0,2.1-1.1*bp,o.big.rot*bp)});else st(o.big.e,{display:'none'})}
 });
 // кінець
 const en=S.end;
 if(t>=en.s-.1){const lt=t-en.s,pe=EO(prog(t,en.s-.08,.3));
  st(en.root,{display:'block',opacity:pe.toFixed(3),transform:tf(0,(1-pe)*40,1,0)});
  const sp=EB(prog(lt,.3,.36));st(en.sk,{opacity:clamp(sp*3).toFixed(2),transform:tf(0,0,2-1*sp,-4*sp)});
  st(en.ar,{opacity:clamp(prog(lt,.8,.2)).toFixed(2),transform:tf(0,Math.sin(lt*7)*16,1,0)});
  const ep=EB(prog(t,en.s+.1,.5));st(en.img,{display:'block',left:'60px',top:(1950-980)+'px',transform:`translate(${((1-ep)*-520).toFixed(1)}px,${(Math.sin(t*3)*7).toFixed(1)}px) scale(1,${(1+.012*Math.sin(t*2.7)).toFixed(4)})`,'transform-origin':'50% 100%'});
  if(lt<.14)flash=Math.max(flash,.4*(1-lt/.14));
 }else{st(en.root,{display:'none'});st(en.img,{display:'none'})}
 st(document.getElementById('flash'),{display:flash>0?'block':'none',opacity:flash.toFixed(2)});
 // шкала прогресу
 st(S.bar,{width:(960*clamp((t-COV)/Math.max(.1,S.total-COV))).toFixed(1)+'px'});
 st(S.hud,{opacity:(t<COV?0:1)});
 // субтитри
 S.words.forEach(w=>{const on=t>=w.a&&t<w.b&&t>=w.minT-.05;
  if(!on){st(w.e,{display:'none'});return}
  st(w.e,{display:'block'});
  w.words.forEach(p=>{const started=t>=p.a-.02;const cur=t>=p.a&&t<p.b;const pp=EB(prog(t,p.a-.02,.18));
   const cls='w'+(p.ac&&started?' ac':'')+(cur&&!p.ac?' on':'');
   if(p.el.className!==cls){p.el.className=cls;DIRTY=true}
   st(p.el,{opacity:started?1:0,transform:tf(0,(1-pp)*24,(cur?1.1:1)*(.6+.4*pp),0)})})});
 DIRTY=true;
 return DIRTY;
}
window.START=START;window.seek=seek;
